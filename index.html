<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sj_yc12 갤러리</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <aside class="sidebar">
    <a class="brand" href="./index.html"><span></span>sj_yc12</a>
    <nav>
      <button class="nav active" data-view="gallery">사진</button>
      <button class="nav" data-view="upload">업로드</button>
      <button class="nav" data-view="folders">폴더</button>
      <button class="nav" data-view="guide">사용법</button>
      <a class="nav insta-link" href="https://www.instagram.com/sj_yc12" target="_blank" rel="noreferrer">Instagram</a>
    </nav>
  </aside>

  <main class="app">
    <header class="mobile-head">
      <a class="brand" href="./index.html"><span></span>sj_yc12</a>
    </header>

    <section class="top">
      <div>
        <p>sj_yc12 archive</p>
        <h1>사진 보관함</h1>
      </div>
      <div class="tools">
        <input id="searchInput" type="search" placeholder="검색" />
        <select id="folderSelect">
          <option value="">전체</option>
        </select>
      </div>
    </section>

    <section id="gallery" class="view show">
      <div class="bar">
        <div>
          <h2>사진</h2>
          <p id="countText">불러오는 중</p>
        </div>
        <div class="bar-actions">
          <button id="manageBtn" class="soft">선택</button>
          <button id="refreshBtn" class="soft">새로고침</button>
        </div>
      </div>
      <div id="managePanel" class="manage-panel hidden">
        <p id="selectedCount">0개 선택됨</p>
        <select id="moveFolderSelect"></select>
        <input id="moveFolderNew" class="hidden" type="text" placeholder="새 폴더명" />
        <input id="managePassword" type="password" inputmode="numeric" placeholder="비밀번호" />
        <button id="moveBtn" class="soft">이동</button>
        <button id="deleteBtn" class="danger">삭제</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">사진이 없습니다</div>
    </section>

    <section id="upload" class="view">
      <div class="bar">
        <div>
          <h2>업로드</h2>
          <p>Cloudflare R2에 사진을 저장합니다</p>
        </div>
      </div>
      <form id="uploadForm" class="upload-panel">
        <label>
          폴더
          <select id="uploadFolderSelect"></select>
        </label>
        <label id="uploadFolderNewWrap" class="hidden">
          새 폴더명
          <input id="uploadFolderNew" type="text" placeholder="예: 660번 / 야간 / 기본" />
        </label>
        <label>
          사진 선택
          <input id="fileInput" name="files" type="file" accept="image/*,video/*,.pdf" multiple />
        </label>
        <label>
          업로드 비밀번호
          <input id="uploadPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력" />
        </label>
        <button id="uploadBtn" class="primary" type="submit">저장하기</button>
        <p id="uploadStatus" class="status"></p>
      </form>
    </section>

    <section id="folders" class="view">
      <div class="bar">
        <div>
          <h2>폴더</h2>
          <p id="folderCount">0개</p>
        </div>
      </div>
      <form id="coverForm" class="cover-panel">
        <select id="coverFolderSelect"></select>
        <input id="coverFolderNew" class="hidden" type="text" placeholder="새 폴더명" />
        <input id="coverFileInput" type="file" accept="image/*" />
        <input id="coverPassword" type="password" inputmode="numeric" placeholder="비밀번호" />
        <button id="coverBtn" class="soft" type="submit">대표사진 저장</button>
      </form>
      <div id="folderGrid" class="folder-grid"></div>
    </section>

    <section id="guide" class="view">
      <div class="guide-card">
        <h2>폰에서 올리는 법</h2>
        <ol>
          <li>업로드 탭에서 기존 폴더를 선택하거나 새 폴더 추가를 선택합니다.</li>
          <li>사진을 여러 장 선택하고 비밀번호를 입력한 뒤 저장합니다.</li>
          <li>폴더 탭에서 폴더 대표사진을 추가하거나 바꿀 수 있습니다.</li>
          <li>사진 탭의 선택 모드에서 이미 올린 사진을 이동하거나 삭제할 수 있습니다.</li>
        </ol>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="mobile-nav active" data-view="gallery">사진</button>
    <button class="mobile-nav" data-view="upload">업로드</button>
    <button class="mobile-nav" data-view="folders">폴더</button>
    <button class="mobile-nav" data-view="guide">사용법</button>
  </nav>

  <dialog id="viewer" class="viewer">
    <button id="closeViewer" class="close">x</button>
    <div id="viewerBody"></div>
  </dialog>

  <script src="./app.js?v=20260622-covers"></script>
</body>
</html>
